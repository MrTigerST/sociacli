[package]
name = "sociacli-overlay"
version = "0.1.0"
edition = "2021"
description = "Bottom-right notification overlay for sociacli"
license = "MIT"

[[bin]]
name = "sociacli-overlay"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` unlocks `WebviewWindowBuilder::transparent` on every
# platform — without it the symbol isn't generated for Linux / macOS builds
# and the overlay won't compile in CI.
tauri = { version = "2", features = ["macos-private-api"] }
# Opens game-invite links in the user's real browser. `window.open` is a no-op
# inside a Tauri webview, so external links need a plugin to reach the OS.
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
